# --- Сеть: только IPv4, UDP + TCP, BSD-сокеты ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONNECTION_MANAGER=y

# Статический адрес платы (DHCP — шаг 4)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.7.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Буферы: эхо-сервер + будущая загрузка образа кусками 1–2 КБ
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=10

# --- Ядро ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y
CONFIG_INIT_STACKS=y
CONFIG_REBOOT=y   # kernel reboot в shell; нужен и mcumgr os reset

# --- Flash: нужна для шага 2 (запись во второй банк) и проверки partitions ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- GPIO (LED «жив») ---
CONFIG_GPIO=y

# --- Логирование и shell (консоль ST-Link, 115200) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK=y
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_FLASH_SHELL=y

# --- mcumgr / SMP по UDP (порт 1337): обновление и управление по сети ---
# Транспорт сам открывает сокет по NET_EVENT_L4_CONNECTED (UDP_AUTOMATIC_INIT).
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
# img_mgmt: приём образа в slot1 через stream_flash.
# ERASE_PROGRESSIVELY: стирать сектор по мере заполнения (1,9 с на 128 КБ),
# а не весь слот при первом куске (13,5 с > таймаут клиента).
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
# os_mgmt: echo, reset, сведения о загрузчике
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
# mcumgr params: клиент узнаёт размер буфера SMP и подбирает размер куска
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# Обработчики SMP работают в system workqueue — ему нужен стек побольше
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
