# sysbuild: собрать MCUboot + приложение одной командой
#   west build -b nucleo_f439zi --sysbuild app/sber-ota -d build_sber_sb
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# swap-move: не нужен scratch, образ в slot0 после обновления остаётся на своём
# адресе (приложение линкуется один раз). Запасной режим перед direct-XIP.
# Слоты 7+7 секторов по 128 КБ: swap-move требует num_pri == num_sec или
# num_pri == num_sec+1; при равенстве последний сектор primary уходит под
# сдвиг + trailer, полезный объём образа = 6 * 128 КБ - trailer.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# ECDSA P-256: подпись 64 байта, верификация быстрее RSA-2048 и меньше кода
# в загрузчике. Ключ по умолчанию — ТЕСТОВЫЙ root-ec-p256.pem из репозитория
# MCUboot (публично известен!). Боевой ключ задавать через
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE вне репозитория.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
